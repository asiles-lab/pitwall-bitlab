services:
  - type: web
    name: pitwall-bitlab-live
    runtime: node
    plan: free
    rootDir: live-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://asiles-lab.github.io,http://127.0.0.1:8787,http://localhost:8787
